html,body{margin:0;min-height:100%;font-family:var(--font);font-size:var(--fs-body);color:var(--ink);background:var(--iv);line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background-color:var(--white)}
input:-webkit-autofill,textarea:-webkit-autofill{-webkit-box-shadow:0 0 0 40px var(--white) inset}
a{color:var(--co)}
:focus-visible{outline:2px solid var(--co);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--t2)}.sm{font-size:var(--fs-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- brand ---------- */
.mark{display:block;flex:none}
.wm{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.035em;color:var(--ink);white-space:nowrap}
.wm sup{font-size:9px;font-weight:600;vertical-align:top;margin-left:1px;position:relative;top:2px}
.brandb{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;height:44px}

/* ---------- shell ---------- */
.app{min-height:100vh}
.main{min-width:0;padding-bottom:calc(var(--tabh) + var(--s6) + env(safe-area-inset-bottom))}
body.hascta .main{padding-bottom:calc(var(--tabh) + 96px + env(safe-area-inset-bottom))}
.side{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:86vw;z-index:60;background:var(--iv);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:var(--s4) var(--s3);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:auto}
body.sideon .side{transform:none}
.sscrim{position:fixed;inset:0;background:rgba(23,23,23,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
body.sideon .sscrim{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;padding:var(--s1) var(--s2) var(--s5)}
.brand .mclose{margin-left:auto}
.newbtn{display:flex;align-items:center;gap:var(--s3);height:var(--btn);padding:0 var(--s4);border-radius:var(--r);border:0;background:var(--co);color:#fff;font-weight:600;margin:0 var(--s1) var(--s5)}
.newbtn:hover{background:var(--co-h)}
.newbtn kbd{margin-left:auto;font:500 11px var(--mono);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:0 5px}
.slabel{font:500 var(--fs-xs) var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:var(--s4) var(--s3) var(--s2)}
.nav button{display:flex;align-items:center;gap:var(--s3);width:100%;height:44px;padding:0 var(--s3);border:0;background:none;border-radius:var(--r-s);color:var(--ink);font-weight:500;text-align:left}
.nav button:hover{background:var(--iv2)}
.nav button.on{background:var(--co-2);color:var(--co);font-weight:600}
.nav button.on svg{color:var(--co)}
.nav button svg{flex:none;color:var(--t2)}
.nav .cnt{margin-left:auto;font:500 12px var(--mono);color:var(--t3)}
.nav .dot{width:8px;height:8px;background:var(--co);margin:0 4px;transform:skewX(-20deg)}
.side .grow{flex:1;min-height:var(--s5)}
.user{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s2);border-top:1px solid var(--line);margin-top:var(--s2)}
.user .av{width:36px;height:36px;border-radius:50%;background:#171717;box-shadow:0 0 0 1px var(--line);color:var(--lime);font:600 12px var(--mono);display:grid;place-items:center}
.user b{display:block;font-size:13.5px;font-weight:600}.user span{font-size:12px;color:var(--t2)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--iv);display:flex;align-items:center;gap:var(--s2);padding:var(--s2) calc(var(--m) - 8px) var(--s2) var(--m);min-height:var(--toph);flex-wrap:wrap}
.top .crumb{display:none}
.top .mmenu{margin-left:auto}
.top.sub{padding-left:calc(var(--m) - 10px)}
.top.sub .ttl{flex:1;min-width:0;text-align:center;font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{display:none}
.tabs{order:10;width:calc(100% + var(--m) + var(--m) - 8px);margin:var(--s1) calc(-1*var(--m) + 8px) -8px calc(-1*var(--m));display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.top.sub .tabs{margin-left:calc(-1*var(--m) + 10px);width:calc(100% + var(--m) + var(--m) - 18px)}
.tabs button{height:48px;padding:0;border:0;background:none;color:var(--ink);font-weight:500;font-size:15.5px;position:relative}
.tabs button+button::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line)}
.tabs button.on{color:var(--co);font-weight:700}
.tabs button.on::after{content:"";position:absolute;left:var(--m);right:var(--m);bottom:-1px;height:3px;background:var(--co)}
.tabs .tc{margin-left:4px}
.ib{width:44px;height:44px;border:0;background:none;border-radius:var(--r);display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{background:var(--iv2)}
.ib:active{transform:scale(.94)}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--iv);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--ink);padding:0;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--co);font-weight:600}
.tabbar button.on svg .fi{fill:currentColor}
.tabbar button:active{transform:scale(.95)}
body.chaton .tabbar,body.sideon .tabbar{visibility:hidden}

/* ---------- type ---------- */
.page{padding:var(--s3) var(--m) var(--s8);max-width:1240px;margin:0 auto;position:relative}
h1{font-family:var(--disp);font-size:var(--fs-h1);font-weight:800;letter-spacing:-.045em;line-height:.95;margin:0}
.lead{color:var(--ink);opacity:.82;margin:var(--s3) 0 0;font-size:16px;line-height:1.4;max-width:560px}
.eyebrow,.lbl{margin:0 0 var(--s3);font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:var(--s2)}
.eyebrow .ix{color:var(--co)}
.eyebrow.on-dark{color:rgba(23,23,23,.7)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s8) 0 0;padding:var(--s4) 0 var(--s3);border-top:1.5px solid var(--ink)}
.sec-h .lbl{margin:0}
.sec-h h3{margin:0;font-family:var(--disp);font-size:var(--fs-h2);font-weight:800;letter-spacing:-.04em;line-height:1}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--co);font-weight:600;font-size:14px;border:0;background:none;padding:0;text-decoration:none;min-height:36px}
.lnk svg{width:16px;height:16px}
.subh{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:var(--s8) 0 0;padding:var(--s4) 0 var(--s3);border-top:1.5px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.subh .ix{color:var(--co)}

/* ---------- controls ---------- */
.card{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r)}
.btn{height:var(--btn);padding:0 var(--s5);border-radius:var(--r);border:1.5px solid transparent;background:var(--co);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);text-decoration:none;white-space:nowrap;font-size:15px;transition:background .15s,transform .1s,opacity .15s}
.btn:hover{background:var(--co-h)}
.btn:active{transform:scale(.98)}
.btn.lg{height:var(--btn-lg);padding:0 var(--s5);font-size:17px;font-weight:700;font-family:var(--disp);letter-spacing:-.02em}
.btn.sm{height:var(--btn-sm);padding:0 var(--s3);font-size:13.5px}
.btn.sec,.btn.out{background:transparent;color:var(--co);border-color:var(--co)}
.btn.sec:hover,.btn.out:hover{background:var(--co-2)}
.btn.ink{background:var(--ink);color:var(--iv)}.btn.ink:hover{background:#000}
.btn.lime{background:var(--lime);color:var(--ink)}.btn.lime:hover{background:var(--lime-h)}
.btn.ghost{background:none;color:var(--co);border:0;padding:0 var(--s2);height:auto;min-height:36px}
.btn.ghost:hover{background:var(--co-2)}
.btn.ok{background:var(--ink);color:var(--lime)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.full{width:100%}
.btn .arr{margin-left:auto}
.btn.lg:has(.arr),.btn:has(.arr){justify-content:flex-start}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{min-height:40px;padding:0 var(--s4);border-radius:99px;border:1.5px solid var(--line);background:transparent;font-weight:500;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--iv)}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.scrollx{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1*var(--m));padding:0 var(--m) 2px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx>*{flex:none}
.tag{font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px;line-height:1.3;white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.p{background:var(--co-2);color:#1A27B0}
.tag.co{background:var(--co);color:#fff}
.tag.ok,.tag.lime{background:var(--lime);color:var(--ink)}
.tag.n{background:var(--iv2);color:var(--ink)}
.tag.bad{background:var(--or);color:#fff}
.tag.w{background:var(--warn-2);color:var(--warn)}
.tag.o{background:transparent;border:1px solid var(--line);color:var(--t2)}
.tag.wh{background:var(--white);color:var(--ink)}
.note{border-radius:var(--r);padding:var(--s3) var(--s4);font-size:14px;display:flex;gap:var(--s3);align-items:flex-start;margin-top:var(--s3);background:var(--paper);border:1px solid var(--line2)}
.note svg{flex:none;margin-top:2px}
.note.warn{background:var(--warn-2);border-color:#EED9A3;color:#4D3600}
.note.bad{background:var(--or-2);border-color:#FFC3A9;color:#5A1A05}
.note.info{color:var(--ink)}
.note.ok{background:var(--lime-2);border-color:#D9F07A}
.empty{text-align:center;color:var(--t2);padding:var(--s12) var(--s5)}
.empty b{display:block;color:var(--ink);font-family:var(--disp);font-size:var(--fs-h3);letter-spacing:-.03em;margin-bottom:6px}
.empty .ez{font:600 40px var(--disp);letter-spacing:-.05em;color:var(--co);display:block;margin-bottom:var(--s2)}
.toast{position:fixed;bottom:calc(var(--tabh) + var(--s4));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--iv);padding:var(--s3) var(--s4);border-radius:var(--r);font-weight:500;opacity:0;transition:all .25s;z-index:120;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.hascta .toast{bottom:calc(var(--tabh) + 96px)}
.fld{display:flex;align-items:center;gap:var(--s3);min-height:60px;border:1.5px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s4);background:var(--white);position:relative}
.fld>svg{flex:none;color:var(--ink)}
.fld .fi{display:flex;flex-direction:column;flex:1;min-width:0}
.fld span{color:var(--t2);font-size:12.5px;font-weight:500}
.fld input,.fld select{border:0;background:var(--white);outline:none;font-weight:600;font-size:17px;padding:0;width:100%;-webkit-appearance:none;appearance:none}
.fld .chev{position:absolute;right:var(--s4);top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink)}
.fld:focus-within{border-color:var(--co);box-shadow:0 0 0 3px var(--co-2)}
.search{display:flex;align-items:center;gap:var(--s3);height:52px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 var(--s4);background:var(--white)}
.search input{flex:1;min-width:0;border:0;outline:none;font-size:16px;background:var(--white)}
.search:focus-within{border-color:var(--co);box-shadow:0 0 0 3px var(--co-2)}
.search .btn{height:40px;margin-right:-10px}
.skel{background:linear-gradient(90deg,var(--iv2),var(--iv3),var(--iv2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r-s)}
@keyframes sk{to{background-position:-200% 0}}
.loadp{margin-top:var(--s5);padding:var(--s4);border:1px solid var(--line2);border-radius:var(--r);background:var(--paper)}
.loadp .lt{display:flex;align-items:center;gap:var(--s3);font-weight:600;margin-bottom:var(--s4)}
.loadp .lr{display:grid;grid-template-columns:56px 1fr;gap:var(--s3);align-items:center;margin-top:var(--s3)}
.loadp .lr i{display:block;height:56px}.loadp .lr b{display:block;height:12px;margin:6px 0}.loadp .lr b+b{width:60%}

/* ---------- tiles / photos ---------- */
.tile{display:block;border-radius:var(--r);overflow:hidden;background:var(--iv2);flex:none;position:relative}
.tile svg{display:block;width:100%;height:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ---------- HOME (ref 01) ---------- */
.hhero{position:relative;padding:var(--s3) 0 var(--s2)}
.hhero .slab{position:absolute;right:calc(-1*var(--m));top:-12px;width:150px;height:108px;background:var(--lime);clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);z-index:0}
.hhero h1{position:relative;z-index:1;font-size:var(--fs-hero);line-height:.9;letter-spacing:-.055em;max-width:380px}
.hhero .lead{position:relative;z-index:1}
.hhero .btn{margin-top:var(--s5)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,152px) minmax(0,1fr) 20px;gap:var(--s4);align-items:center;padding:var(--s4) 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none}
.prow:first-child{padding-top:var(--s2)}
.prow .tile{width:100%;aspect-ratio:3/2;border-radius:var(--r)}
.prow b.pn{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:.98;display:block}
.prow .ps{margin-top:var(--s2);display:flex;gap:6px;flex-wrap:wrap}
.prow .pm{font:500 12.5px var(--mono);color:var(--ink);margin-top:var(--s2)}
.prow .pa{display:flex;flex-direction:column;align-items:center;gap:var(--s3);justify-self:end}
.prow .hpdel{width:32px;height:32px;color:var(--t3)}
.prow:active{background:var(--iv2)}
.hconfirm{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.mapcard{height:360px;position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line2);background:#ECE6DA}
.hempty{border:1.5px dashed var(--line);border-radius:var(--r);padding:var(--s6) var(--s5);margin-top:var(--s2)}
.hempty b{font-family:var(--disp);font-size:var(--fs-h3);letter-spacing:-.03em;display:block}
.hempty p{margin:var(--s2) 0 var(--s4);color:var(--t2)}

/* ---------- NEW ---------- */
.nhero{position:relative;padding:var(--s2) 0 0}
.nhero .tri{position:absolute;right:calc(-1*var(--m));top:calc(-1*var(--toph) - 4px);width:132px;height:132px;background:var(--lime);clip-path:polygon(100% 0,100% 100%,0 0);z-index:0}
.nhero h1{font-size:44px;line-height:.92;position:relative;letter-spacing:-.05em;max-width:330px}
.nhero .lead{position:relative}
.comp{margin-top:var(--s6)}
.comp .ta{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r);padding:var(--s4);position:relative}
.comp .ta:focus-within{border-color:var(--co);box-shadow:0 0 0 3px var(--co-2)}
.comp textarea{width:100%;border:0;outline:none;resize:none;font-size:17px;line-height:1.45;min-height:136px;padding:0;background:var(--white)}
.comp textarea::placeholder{color:#9D968C}
.comp .cnt{display:block;text-align:right;font:500 12px var(--mono);color:var(--t3);margin-top:var(--s2)}
.fields{display:grid;grid-template-columns:1fr;gap:var(--s3);margin-top:var(--s3)}
.fields .btn{margin-top:var(--s2)}
.exs{margin-top:var(--s8)}
.chip.demo{border-style:dashed}
.ask{margin-top:var(--s4);border:1.5px solid var(--ink);background:var(--paper);border-radius:var(--r);padding:var(--s4)}
.ask h4{margin:0 0 var(--s2);font-family:var(--disp);font-size:var(--fs-h3);font-weight:800;letter-spacing:-.03em;display:flex;align-items:flex-start;gap:var(--s2);line-height:1.1}
.ask h4 svg{color:var(--co);flex:none;margin-top:3px}
.ask label{display:block;font-weight:600;margin:var(--s4) 0 var(--s2)}
.ask input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 var(--s3);background:var(--white);outline:none;font-size:16px}
.ask input:focus{border-color:var(--co)}
.qopts{margin:var(--s1) 0 var(--s2)}

/* ---------- MATERIALS (ref 02) ---------- */
.tot{position:relative;overflow:hidden;background:var(--lime);margin:0 calc(-1*var(--m));min-height:120px;display:flex;align-items:center;padding:var(--s5) var(--m)}
.tot .tph{position:absolute;right:0;top:0;bottom:0;width:46%;clip-path:polygon(34% 0,100% 0,100% 100%,0 100%)}
.tot .tph .tile,.tot .tph img{width:100%;height:100%;border-radius:0}
.tot .tv{position:relative;z-index:1;max-width:62%}
.tot .tv span{display:block;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tot .tv b{display:block;font-family:var(--disp);font-size:46px;font-weight:800;letter-spacing:-.055em;line-height:1;margin-top:var(--s2)}
.tbud{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);font:500 13px var(--mono)}
.tbud .bar{flex:1;height:6px;background:var(--iv2);overflow:hidden;border-radius:3px}
.tbud .bar i{display:block;height:100%;background:var(--co)}
.tbud .bar i.over{background:var(--or)}
.tbud .ok{color:var(--ink)}.tbud .ov{color:var(--bad)}
.phead{display:flex;flex-direction:column;gap:var(--s3);margin:var(--s5) 0 var(--s2)}
.phead h1{font-size:var(--fs-h2)}
@media(max-width:899px){.phead h1{display:none}}
.phead .lead{font-size:14.5px;margin-top:var(--s1)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:var(--s3) var(--s4);padding:var(--s4) 0;border-bottom:1px solid var(--line);align-items:start}
.mrow .tile{width:96px;height:96px;cursor:pointer;grid-row:1 / span 2;align-self:start}
.mrow>[data-open]:first-child{grid-row:1 / span 2;align-self:start;display:block}
.mrow .mi{min-width:0;cursor:pointer}
.mrow b.mn{font-weight:700;font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.mrow .ms{font:400 13px var(--mono);color:var(--ink);margin-top:var(--s1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mst{font-size:12.5px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mst svg{flex:none;width:12px;height:12px}
.mrow .mp{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.03em;white-space:nowrap;text-align:right}
.mrow .mpu{display:block;font:400 11.5px var(--mono);color:var(--t2);text-align:right;margin-top:2px}
.mrow .mfoot{grid-column:2 / 4;display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.mrow .mtags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.mrow .mact{display:flex;align-items:center;gap:2px;flex:none}
.mrow .rm{width:36px;height:36px;margin-right:-8px}

/* ---------- STORES / LISTS ---------- */

/* ---------- CHAT ---------- */
.fab{display:none}

.ch-h{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:var(--s2);padding:var(--s1) calc(var(--m) - 10px);min-height:var(--toph);border-bottom:1px solid var(--line)}

.msg.a{align-self:flex-start;background:var(--white);border-radius:16px 16px 16px 4px;padding:var(--s3) var(--s4);color:var(--ink);border:1px solid var(--line2)}

.msg .chg{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:var(--s2) var(--s3);font-size:13px}

.ch-empty .chips{flex-direction:column;align-items:stretch;gap:0;border-top:1.5px solid var(--ink);margin-top:var(--s4)}

.ch-empty .chip::after{content:"→";color:var(--co);font-weight:700;margin-left:var(--s3)}

// ---------- procedural material swatches (Material Bank style) ----------
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function rnd(seed){let x=seed||1;return()=>((x=(x*16807)%2147483647)/2147483647);}
function swatch(x){
  const r=rnd(hash(x.id)+7), id="g"+hash(x.id);
  const n=x.n.toLowerCase(); let body="";
  const noise=(col,cnt,op)=>{let s="";for(let i=0;i<cnt;i++)s+=`<circle cx="${(r()*200).toFixed(1)}" cy="${(r()*140).toFixed(1)}" r="${(r()*1.4+.3).toFixed(2)}" fill="${col}" opacity="${op}"/>`;return s;};
  if(x.c==="Madera"){
    const base=n.includes("balsa")?"#EAD9B8":n.includes("corcho")?"#B98A5A":n.includes("mdf")?"#B98F64":"#D8B07E";
    body=`<rect width="200" height="140" fill="${base}"/>`;
    if(n.includes("corcho")) body+=noise("#7A5530",260,.55)+noise("#E2C29A",140,.6);
    else if(n.includes("mdf")) body+=noise("#8A6440",320,.35)+noise("#D9B58C",200,.45);
    else{for(let i=0;i<18;i++){const y=r()*140;body+=`<path d="M0 ${y.toFixed(1)} C 60 ${(y+r()*10-5).toFixed(1)}, 120 ${(y+r()*12-6).toFixed(1)}, 200 ${(y+r()*8-4).toFixed(1)}" stroke="#9A6E43" stroke-width="${(r()*1.6+.4).toFixed(2)}" fill="none" opacity="${(r()*.35+.15).toFixed(2)}"/>`;}}
  } else if(x.c==="Cartones y papeles"){
    const base=n.includes("negra")?"#2A2A2C":n.includes("kraft")?"#C49A6C":n.includes("gris")?"#9C9A95":n.includes("piedra")?"#A8A49C":n.includes("mantequilla")?"#F1EFE6":n.includes("micro")?"#C9A57A":"#F6F4EF";
    body=`<rect width="200" height="140" fill="${base}"/>`+noise(n.includes("negra")?"#555":"#6E6A62",n.includes("opalina")||n.includes("mantequilla")?40:240,.3);
    if(n.includes("micro")) for(let i=0;i<40;i++) body+=`<rect x="${i*5}" y="0" width="2.4" height="140" fill="#A9845A" opacity=".45"/>`;
  } else if(x.c==="Espumas y plásticos"){
    const base=n.includes("negro")?"#2D2D30":n.includes("eva")?"#7FB8E6":n.includes("plumavit")?"#FBFBF9":"#FFFFFF";
    body=`<rect width="200" height="140" fill="${base}"/>`;
    if(n.includes("plumavit")) for(let i=0;i<120;i++) body+=`<circle cx="${r()*200}" cy="${r()*140}" r="${r()*5+3}" fill="none" stroke="#E4E4DF" stroke-width=".8"/>`;
    else body+=`<rect x="0" y="96" width="200" height="44" fill="${n.includes("negro")?"#1C1C1E":"#EEEDEA"}"/><rect x="0" y="96" width="200" height="4" fill="${n.includes("negro")?"#3A3A3D":"#FFFFFF"}"/><rect x="0" y="136" width="200" height="4" fill="${n.includes("negro")?"#3A3A3D":"#F7F7F5"}"/>`+noise("#000",30,.04);
  } else if(x.c==="Transparentes"){
    const base=x.col?x.col:n.includes("negro")?"#151517":n.includes("blanco")?"#F3F3F1":n.includes("espejo")?"#C9CED3":n.includes("acetato")||n.includes("petg")?"#EEF4F6":"#DDEEF3";
    body=`<rect width="200" height="140" fill="${base}"/><path d="M-20 140 L90 0 L120 0 L10 140z" fill="#fff" opacity="${n.includes("negro")?.1:.55}"/><path d="M40 140 L150 0 L160 0 L50 140z" fill="#fff" opacity="${n.includes("negro")?.06:.4}"/>`;
    if(n.includes("espejo")) body+=`<rect width="200" height="140" fill="url(#${id})" opacity=".0"/>`;
  } else if(x.c==="Estructura"){
    body=`<rect width="200" height="140" fill="#F3EFE8"/>`;
    const col=n.includes("alambre")||n.includes("acero")?"#9AA0A6":n.includes("balsa")?"#E5CFA4":"#C99A62";
    if(n.includes("alambre")) body+=`<path d="M10 120 C 60 20, 140 140, 190 30" stroke="${col}" stroke-width="3" fill="none"/><path d="M10 100 C 70 10, 130 130, 190 15" stroke="${col}" stroke-width="3" fill="none" opacity=".6"/>`;
    else for(let i=0;i<9;i++){const x0=20+i*19+r()*4;body+=`<rect x="${x0}" y="${10+r()*10}" width="${n.includes("6 mm")||n.includes("brocheta")?9:n.includes("5×5")?8:6}" height="${110+r()*10}" rx="2" fill="${col}" transform="rotate(${(r()*16-8).toFixed(1)} ${x0} 70)"/>`;}
  } else {
    const pal={"Adhesivos":["#FFF1E6","#E07A2F"],"Herramientas":["#EEF0F2","#4A5059"],"Terminación":["#ECF4EC","#3E7D4F"],"Ferretería":["#EEEFF1","#6B7078"],"Electrónica":["#E8F0FB","#1A56C4"],"Servicios":["#F1ECFB","#6C2BD9"]}[x.c]||["#eee","#666"];
    body=`<rect width="200" height="140" fill="${pal[0]}"/>`;
    const g={"Adhesivos":`<rect x="80" y="38" width="40" height="78" rx="8" fill="${pal[1]}"/><rect x="90" y="22" width="20" height="18" rx="3" fill="${pal[1]}" opacity=".7"/><rect x="86" y="62" width="28" height="22" rx="3" fill="#fff" opacity=".8"/>`,
      "Ferretería":Array.from({length:6},(_,i)=>{const cx=40+(i%3)*60,cy=45+Math.floor(i/3)*50;return n.includes("tuerca")||n.includes("golilla")?`<polygon points="${[0,1,2,3,4,5].map(k=>(cx+16*Math.cos(k*Math.PI/3)).toFixed(1)+","+(cy+16*Math.sin(k*Math.PI/3)).toFixed(1)).join(" ")}" fill="${pal[1]}"/><circle cx="${cx}" cy="${cy}" r="6" fill="${pal[0]}"/>`:n.includes("imán")||n.includes("iman")?`<circle cx="${cx}" cy="${cy}" r="14" fill="#9AA0A6"/><circle cx="${cx}" cy="${cy}" r="9" fill="#C3C7CC"/>`:`<rect x="${cx-3}" y="${cy-18}" width="6" height="34" rx="2" fill="${pal[1]}"/><rect x="${cx-9}" y="${cy-22}" width="18" height="6" rx="2" fill="${pal[1]}"/>`;}).join(""),
      "Electrónica":`<rect x="62" y="36" width="76" height="68" rx="6" fill="${pal[1]}"/><rect x="80" y="54" width="40" height="32" rx="3" fill="#0E2E6B"/>`+Array.from({length:6},(_,i)=>`<rect x="${68+i*12}" y="26" width="4" height="10" fill="#B8C2D6"/><rect x="${68+i*12}" y="104" width="4" height="10" fill="#B8C2D6"/>`).join(""),
      "Servicios":`<rect x="40" y="94" width="120" height="14" rx="3" fill="#C9B8F0"/><path d="M100 24 L100 90" stroke="${pal[1]}" stroke-width="3"/><circle cx="100" cy="92" r="5" fill="#FF4F1A"/><path d="M60 94 Q100 60 140 94" stroke="${pal[1]}" stroke-width="2" fill="none" stroke-dasharray="4 4"/>`,
      "Herramientas":`<rect x="40" y="62" width="120" height="16" rx="3" fill="${pal[1]}"/><path d="M160 62 l22 8 -22 8z" fill="#9AA0A6"/><rect x="40" y="62" width="44" height="16" rx="3" fill="#FF8A3D"/>`,
      "Terminación":n.includes("árbol")?`<circle cx="100" cy="62" r="30" fill="${pal[1]}"/><rect x="96" y="88" width="8" height="30" fill="#7A5530"/>`:n.includes("figura")?`<circle cx="80" cy="44" r="9" fill="#5F6368"/><rect x="72" y="56" width="16" height="44" rx="6" fill="#5F6368"/><circle cx="118" cy="50" r="8" fill="#9AA0A6"/><rect x="111" y="61" width="14" height="38" rx="6" fill="#9AA0A6"/>`:n.includes("auto")?`<rect x="56" y="66" width="88" height="26" rx="8" fill="#5F6368"/><rect x="74" y="50" width="50" height="22" rx="7" fill="#7E848A"/><circle cx="78" cy="94" r="8" fill="#2A2E33"/><circle cx="122" cy="94" r="8" fill="#2A2E33"/>`:n.includes("led")?Array.from({length:7},(_,i)=>`<circle cx="${30+i*23}" cy="${70+Math.sin(i)*14}" r="6" fill="#FFD54F"/>`).join("")+`<path d="M20 70 C 60 40, 140 100, 190 60" stroke="#666" fill="none"/>`:n.includes("spray")?`<rect x="82" y="40" width="36" height="80" rx="6" fill="${n.includes("negro")?"#222":"#E9E9E6"}" stroke="#bbb"/><rect x="92" y="26" width="16" height="16" rx="3" fill="#999"/>`:`<rect x="0" y="80" width="200" height="60" fill="${n.includes("pasto")?"#6FA35A":n.includes("grava")?"#C8BBA4":pal[1]}"/>`+noise("#2F5A28",n.includes("pasto")?200:0,.4)+noise("#8C7B60",n.includes("grava")?260:0,.6)}[x.c];
    body+=g;
  }

  if(/\bmdf\b|trupan/.test(n))return PH.mdf;
  if(/terciado|contrachapado|osb|madera|pino/.test(n)&&!/balsa|palito|brocheta|carton|corcho|lapiz|regla/.test(n))return PH.madera;
  if(/microcorrugado|corrugado|kraft/.test(n)&&/carton|papel/.test(n))return PH.carton;
  if(/(cinta|tira|manguera).*led|led.*(cinta|tira)/.test(n))return PH.led;
  if(/tornillo|perno|roscalata/.test(n))return PH.tornillo;
  if(/alumin|perfil metal|plancha metal|acero inox/.test(n))return PH.aluminio;
  return null;}

const STOP=new Set("para,como,con,una,unos,unas,que,los,las,del,necesito,quiero,hacer,algo,cosa,cosas,tengo,mas,muy,base,sobre,entre,donde,cada,este,esta,pero,porque,tambien,mucho,poco,puedo,reemplazar,por,cuanto,cuantos".split(","));
function aiCat(text){
  const n=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const w=[...new Set(n(text).split(/[^a-z0-9]+/).filter(t=>t.length>=4&&!STOP.has(t)))].map(t=>t.length>5?t.slice(0,t.length-1):t);
  const base=CAT.filter(x=>!x.ez&&!x.ext);
  const sc=CAT.filter(x=>x.ez||x.ext).map(x=>{const h=n(x.n+" "+x.u);return[x,w.reduce((a,t)=>a+(h.includes(t)?1:0),0)];}).filter(z=>z[1]>0).sort((a,b)=>b[1]-a[1]||(S.form.pref==="calidad"?b[0].p-a[0].p:a[0].p-b[0].p)).slice(0,180).map(z=>z[0]);
  return base.concat(sc);
}

  const resp=S.preguntas.filter(q=>q.respuesta).map(q=>`- ${q.pregunta} → ${q.respuesta}`).join("\n"),f=S.form;
  return `Eres el asistente de RutaMaterial, una app para estudiantes de diseño y arquitectura que necesitan conseguir materiales para un PROYECTO (maquetas, prototipos, objetos, electrónica). El usuario puede escribir una lista concreta o describir su proyecto. Tu trabajo es convertir eso en una lista de productos del catálogo.

REGLAS
1. Usa únicamente productos del catálogo, por "id". No inventes productos, marcas ni precios.
2. Si el usuario da una lista, respétala: busca el producto más parecido del catálogo para cada cosa. Si no dice cantidad, usa 1. No agregues cosas que no pidió, salvo algo imprescindible para que funcione (y márcalo esencial:false con el motivo).
3. NO INVENTES CARACTERÍSTICAS. Nunca elijas un color, espesor, medida, terminación o marca que el usuario no dijo (si pidió "MDF", no le pongas "MDF negro"). Si en el catálogo hay variantes que cambian en algo que no especificó: incluye la versión estándar o neutra (natural, sin color, la medida más común), márcala "por_definir": true y agrega una pregunta en "preguntas" con "item" (el id) y "opciones" (2 a 5 alternativas cortas tomadas del catálogo, ej. "3 mm", "5 mm", "Natural", "Negro"). Así el usuario ve la lista completa y solo elige lo que falta. Máximo 4 preguntas. No preguntes cosas que no cambian el producto ni pidas datos personales. Si el usuario ya respondió una pregunta (ver ACLARACIONES DEL USUARIO), usa esa respuesta y no la repitas.
3b. PREFERENCIA DE CALIDAD (ver PREFERENCIAS): "barato" = la variante más económica que sirva; "equilibrio" = buena relación calidad-precio, no automáticamente la más barata; "calidad" = mejor terminación, marca reconocida o mayor durabilidad dentro de lo pedido, aunque cueste más. Si hay presupuesto, intenta respetarlo; si no hay, no optimices solo por precio.
4. Si describe un proyecto sin lista, propone los materiales esenciales. Si entrega medidas, úsalas para las cantidades (superficie ÷ area_cm2 + 15%, hacia arriba).
5. "motivo": una frase corta y útil (por qué ese producto o cómo calculaste).
6. "no_encontrados": cosas que pidió y NO existen en el catálogo, en sus palabras.
7. "faltantes": máximo 2 cosas que probablemente le sirvan y no pidió (pueden ser servicios como corte láser).
8. Si pide algo fuera de alcance (comprar, pagar, despachar por él, precios en tiempo real), explícalo en "fuera_de_alcance" en una frase. Igual arma la lista.
9. No pidas datos personales ni de pago. Español de Chile, claro y breve.
10. "nombre": nombre corto del proyecto (máx. 4 palabras).

Responde SOLO con JSON válido:
{"nombre": string, "resumen": string, "preguntas": [{"id": string, "pregunta": string, "item": string|null, "opciones": [string]}], "items": [{"id": string, "cantidad": number, "motivo": string, "esencial": boolean, "por_definir": boolean}], "no_encontrados": [string], "faltantes": [string], "fuera_de_alcance": string|null}

CATÁLOGO
${JSON.stringify(cat)}

PEDIDO DEL USUARIO
${f.desc.trim()}
Presupuesto: ${f.presu.trim()?f.presu.trim()+" CLP":"(no indicado)"}
PREFERENCIAS: calidad = ${f.pref||"equilibrio"}
${resp?"ACLARACIONES DEL USUARIO:\n"+resp:""}`;
}

/* ---------- IA: dentro de Claude usa la cuenta del usuario; en la web usa la función /api/ai ---------- */
const webSample=Object.assign(async(prompt)=>{
  const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j.error||("La IA respondió con un error "+r.status));e.code=r.status===429?"rate_limited":"web_"+r.status;throw e;}
  return {text:j.text||""};
},{json:async(p)=>{const r=await webSample(p);return parseJSON(r.text);}});
async function getSample(){
  if(window.claude&&claude.use){try{return await claude.use("sample");}catch(e){return null;}}
  if(/^https?:$/.test(location.protocol))return webSample;
  return null;
}

  const big=nm.a.length>8?(nm.a.length>11?36:44):56;
  const shown=all?st:st.slice(0,3);
  d.innerHTML=`<div class="dh"><button class="ib" id="dclose" aria-label="Cerrar ficha">${IBACK}</button><span class="tag n">${x.c}</span></div><div class="db"><div class="dph">${tile(x)}</div><div class="dbody">
    <div class="dlbl">Material / ${idx}</div>
    <div class="dtitle"><span class="dtri" aria-hidden="true"></span><span class="d1" style="font-size:${big}px">${esc(nm.a)}</span>${nm.b?`<span class="d2">${esc(nm.b)}</span>`:""}${nm.m?`<span class="d3">${esc(nm.m)}</span>`:""}<span class="sr">${esc(x.n)}</span></div>
    <p class="muted" style="margin:16px 0 0">${esc(x.u)}.</p>
    <div class="dspec"><div><i>Formato</i><b>${x.f||"—"}</b></div>${nm.m?`<div><i>Medida</i><b>${esc(nm.m)}</b></div>`:`<div><i>Disponible en</i><b>${st.length} ${st.length===1?"lugar":"lugares"}</b></div>`}<div><i>Categoría</i><b>${x.c}</b></div><div><i>${x.s==="c"?"Referencia":"Desde"}</i><b>${fmt(mn)}</b></div></div>
    ${inL&&inL.motivo?`<p class="dwhy"><b>En tu lista:</b> ${esc(inL.motivo)}</p>`:""}
    <div class="dwhere"><span>Proveedores (${st.length})</span>${st.length>3&&!all?`<button class="lnk" id="dall">Ver todos ${LARR}</button>`:""}</div>
    ${shown.map((o,i)=>{const v=verifyLink(o.s,id);return `<a class="srow" href="${esc(v.url)}" target="_blank" rel="noopener" title="${v.exact?"Abrir el producto en":"Buscar en"} ${esc(v.label)}">${logo(o.s)}<div class="t"><b>${esc(o.s.n.replace(" (acrílicos)",""))}</b><span>${o.s.mode==="online"?`Envío · ~${o.s.dias} días`:esc(o.s.dir)}</span></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="p">${fmt(o.p)}</span>${i===0?'<span class="tag lime">Mejor precio</span>':o.s.mode==="tienda"?'<span class="tag o">En tienda</span>':""}</div><span class="go">${v.exact?"Ver":"Buscar"}${CHEV}</span></a>`;}).join("")}
    <div class="note info">${I.info}<div>${x.s==="c"?"Servicio: el precio es una referencia. Cotiza enviando tu archivo; los Fab Lab universitarios pueden pedir inscripción o ser solo para su comunidad.":x.ext?`Precio leído en ${esc(x.pr)} el 16 de noviembre de 2026${x.nst?". Sodimac no publica stock por tienda en su buscador: confírmalo antes de ir":". Lo vende un vendedor externo de Mercado Libre: revisa reputación, envío y stock"}. <a href="${esc(x.url)}" target="_blank" rel="noopener">Ver producto</a>`:x.ez?`Precio y stock leídos en easy.cl el 15 de noviembre de 2026${x.unk?"":x.st.length?` · con stock en ${x.st.length} tienda(s) Easy de Santiago`:" · sin stock en tiendas de Santiago"}${x.unk?"":x.on?" · disponible online":" · no disponible para despacho"}. Easy indica “precio sujeto a ubicación” y el stock puede variar por tienda. <a href="https://www.easy.cl/search/${encodeURIComponent(x.n)}" target="_blank" rel="noopener">Ver en easy.cl</a>`:x.s==="v"?`Precio confirmado en ${esc(x.pr)} (noviembre 2026${x.pr==="Novoacril"?", precio desde con IVA":""}). En las demás tiendas es una estimación.`:"Precios estimados. Confírmalos con la tienda."}</div></div></div></div>
    <div class="df"><button class="btn lg full" id="addp">${I.plus}${inL?`Agregar otro (tienes ${inL.cantidad})`:"Agregar al proyecto"}${ARR}</button></div>`;
  d.classList.add("on"); $("#dclose").onclick=closeDrawer;if($("#dall"))$("#dall").onclick=()=>openProduct(id,true);
  $("#addp").onclick=()=>{const it=S.items.find(i=>i.id===id);if(it)it.cantidad=(it.cantidad||0)+1;else S.items.push({id,cantidad:1,motivo:"",esencial:!x.opt});if(!S.name)S.name="Mi proyecto";S.plan=null;renderSide();toast(`${x.n} agregado a ${S.name}`);openProduct(id,all);if(S.view==="catalog")renderCat();};
}
function closeDrawer(){$("#drawer").classList.remove("on");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();sideOpen(false);document.querySelector(".pmodal")?.remove();}});
$("#sscrim").onclick=()=>sideOpen(false);

function viewStores(){
  const t=STORES.filter(s=>s.mode==="tienda"),o=STORES.filter(s=>s.mode==="online");S.stQ=S.stQ||"";S.stF=S.stF||"all";
  $("#main").innerHTML=topbar(`<b>Tiendas</b>`)+`<div class="page"><p class="eyebrow"><span class="ix">${STORES.length}</span>Dónde comprar</p><h1>Tiendas y proveedores</h1><p class="lead">${t.length} tiendas en Santiago y ${o.length} opciones con envío. Busca por nombre o comuna y compara cuántos productos del catálogo tiene cada una.</p>
    <div class="search" style="margin-top:18px">${I.search}<input id="sq" placeholder="Buscar: Easy, Providencia, acrílicos…" value="${esc(S.stQ)}" autocomplete="off"></div>
    <div class="chips" id="sf" style="margin-top:10px"></div><div id="slist"></div>
    <div class="note info">${I.info}<div>En Easy, el stock por tienda se leyó de easy.cl el 15 de noviembre de 2026 (Portal Ñuñoa y El Llano quedan fuera porque cierran a fin de año). En las demás tiendas, qué vende cada una está cargado según su rubro. Nada de esto es inventario en tiempo real.</div></div></div>`;
  $("#sq").oninput=e=>{S.stQ=e.target.value;renderStores();};renderStores();
}
function renderStores(){
  const F=[["all","Todas"],["tienda","Tiendas físicas"],["online","Online"],["svc","Servicios"]];
  $("#sf").innerHTML=F.map(f=>`<button class="chip ${S.stF===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("");
  $("#sf").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.stF=b.dataset.f;renderStores();});
  const q=norm(S.stQ.trim());
  const L=STORES.filter(s=>(S.stF==="all"||(S.stF==="svc"?s.svc:S.stF==="tienda"?s.mode==="tienda"&&!s.svc:s.mode==="online"))&&(!q||norm(s.n+" "+(s.dir||"")+" "+s.brand).includes(q))).sort((a,b)=>(a.mode===b.mode?0:a.mode==="tienda"?-1:1)||b.items.length-a.items.length);
  $("#slist").innerHTML=L.length?`<div class="slist">${L.map(s=>`<div class="strow">${logo(s)}<div style="min-width:0"><b>${s.n.replace(" (acrílicos)","")}</b><div class="sd">${s.mode==="online"?`Llega en ~${s.dias} días · envío ${fmt(s.envio)}${s.gratisDesde?` (gratis sobre ${fmt(s.gratisDesde)})`:""}`:esc(s.dir)}</div><div style="margin-top:6px"><span class="tag ${s.mode==="online"?"p":s.svc?"w":"n"}">${s.mode==="online"?"Online":s.svc?"Servicio":"Tienda física"}</span></div></div><div class="sn"><b>${s.items.length}</b><br>productos</div></div>`).join("")}</div>`:`<div class="empty"><b>Sin resultados</b>Prueba con otro nombre o comuna.</div>`;
}
function viewHistory(){
  $("#main").innerHTML=topbar(`<b>Historial de IA</b>`)+`<div class="page"><div class="phead"><div><p class="eyebrow"><span class="ix">${String(S.log.length).padStart(2,"0")}</span>Evidencia</p><h1>Historial de IA</h1><p class="lead">Cada lista que arma la IA queda registrada: qué pediste, qué respondió y qué controles se aplicaron.</p></div>
    <div style="display:flex;gap:8px"><button class="btn sec" id="cpl">Copiar registro</button><button class="btn sec" id="clr">Borrar</button></div></div>
    ${S.log.length?`<div class="hlist">${S.log.map(l=>`<div class="hrow"><div class="ht">${esc(l.t)} · ${(l.ms/1000).toFixed(1)} s</div><b>${esc(l.entrada.desc)}</b><div class="muted sm">${esc(l.salida.nombre||"")} · ${(l.salida.items||[]).length} materiales</div><div class="chips" style="margin-top:8px">${l.controles.preguntas?`<span class="tag w">${l.controles.preguntas} pregunta(s)</span>`:""}${l.controles.fuera_de_catalogo_descartados.length?`<span class="tag bad">${l.controles.fuera_de_catalogo_descartados.length} fuera de catálogo</span>`:""}${l.salida.fuera_de_alcance?`<span class="tag n">Fuera de alcance</span>`:""}${!l.controles.preguntas&&!l.controles.fuera_de_catalogo_descartados.length&&!l.salida.fuera_de_alcance?`<span class="tag ok">Sin alertas</span>`:""}</div></div>`).join("")}</div>`:`<div class="hlist"><div class="empty"><b>Aún no hay registros</b>Arma tu primera lista con IA desde Nuevo proyecto.</div></div>`}</div>`;
  $("#cpl").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S.log,null,2));toast("Registro copiado");}catch(e){toast("No se pudo copiar");}};
  $("#clr").onclick=()=>{S.log=[];try{localStorage.removeItem("rm_log")}catch(e){}renderSide();viewHistory();};
}
const SI={user:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17.5c.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5"/></svg>`,
 moon:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z"/></svg>`,
 text:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 16 7.5 4h1L13 16M4.8 12h6.4M13.5 16l2.5-6.5h.5L19 16"/></svg>`,
 motion:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 10h4M14 10h4M10 2v4M10 14v4"/><circle cx="10" cy="10" r="2"/></svg>`,

 coin:`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7.5"/><path d="M12.5 7.5c-.4-1-1.3-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.2 0-2.1-.5-2.5-1.5M10 4.5V6M10 14v1.5"/></svg>`,

const tgl=(id,on,label)=>`<label class="tgl"><input type="checkbox" id="${id}" ${on?"checked":""} aria-label="${label}"><i></i></label>`;
function viewSettings(){
  const st=S.set,ini=(st.name||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const orig=ORIGENES.map((o,i)=>`<option value="${i}" ${i==st.origen?"selected":""}>${esc(o.n.split(" · ")[0].replace(/ \(.*\)/,""))}</option>`).join("");
  const mov=["transit","driving","bicycling","walking"].map(k=>`<option value="${k}" ${st.movil===k?"selected":""}>${MOV[k].label.replace("Transporte público","Micro/metro")}</option>`).join("");
  const pri=Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${st.prio===k?"selected":""}>${v[0]}</option>`).join("");
  const nv=Object.keys(S.verif||{}).length;
  $("#main").innerHTML=topbar(`<b>Ajustes</b>`)+`<div class="page" style="max-width:720px">
    <div class="pgh" style="margin-bottom:0"><p class="eyebrow">Cuenta y app</p><h1>Ajustes</h1></div>
    <div class="slistx" style="margin-top:20px"><div class="prof" style="padding:16px"><span class="avb">${esc(ini)}</span><div style="min-width:0"><b>${esc(st.name||"Sin nombre")}</b><span>${esc([st.role,st.org].filter(Boolean).join(" · ")||"Agrega tu carrera o profesión")}</span></div></div>
      <button class="srw" id="sedit" aria-expanded="false"><span class="si">${SI.user}</span><span class="st"><b>Editar perfil</b><span>Nombre, carrera o profesión e institución</span></span>${CHEV}</button>
      <div class="pform" id="pform" hidden>
        <label class="fld"><div class="fi"><span>Nombre</span><input id="pf-name" value="${esc(st.name)}" autocomplete="name"></div></label>
        <label class="fld"><div class="fi"><span>Carrera o profesión</span><input id="pf-role" value="${esc(st.role)}" placeholder="Ej: Diseño de Interacción"></div></label>
        <label class="fld"><div class="fi"><span>Universidad o lugar de trabajo</span><input id="pf-org" value="${esc(st.org)}" placeholder="Ej: UDD"></div></label>
        <div class="row"><button class="btn out" id="pf-cancel">Cancelar</button><button class="btn" id="pf-save">Guardar</button></div></div></div>

    <div class="sgrp"><p class="lbl">Apariencia</p><div class="slistx">
      <div class="srw"><span class="si">${SI.moon}</span><span class="st"><b>Tema</b><span>Modo claro, oscuro o según tu teléfono</span></span></div>
      <div style="padding:0 16px 16px"><div class="seg" id="s-theme">${[["light","Claro"],["dark","Oscuro"],["system","Sistema"]].map(t=>`<button data-v="${t[0]}" class="${st.theme===t[0]?"on":""}">${t[1]}</button>`).join("")}</div></div>
      <div class="srw" style="border-top:1px solid var(--line2)"><span class="si">${SI.text}</span><span class="st"><b>Texto más grande</b><span>Aumenta el tamaño de toda la app</span></span>${tgl("s-fs",st.fs==="lg","Texto más grande")}</div>
      <div class="srw"><span class="si">${SI.motion}</span><span class="st"><b>Reducir animaciones</b><span>Quita transiciones y movimientos</span></span>${tgl("s-motion",st.motion,"Reducir animaciones")}</div></div></div>

    <div class="sgrp"><p class="lbl">Compras · valores para proyectos nuevos</p><div class="slistx">
      <div class="srw"><span class="si">${SI.pin}</span><span class="st"><b>Punto de partida</b></span><select id="s-orig" aria-label="Punto de partida">${orig}</select></div>
      <div class="srw"><span class="si">${SI.bus}</span><span class="st"><b>Me muevo en</b></span><select id="s-mov" aria-label="Medio de transporte">${mov}</select></div>
      <div class="srw"><span class="si">${SI.star}</span><span class="st"><b>Prefiero</b></span><select id="s-prio" aria-label="Preferencia del plan">${pri}</select></div>
      <div class="srw"><span class="si">${SI.coin}</span><span class="st"><b>Preguntar presupuesto</b><span>Antes de armar la lista o el plan</span></span>${tgl("s-ask",st.askBudget,"Preguntar presupuesto")}</div></div></div>

    <div class="sgrp"><p class="lbl">Ruta IA</p><div class="slistx">
      <div class="srw"><span class="si">${SI.clock}</span><span class="st"><b>Guardar historial de IA</b><span>Registro de cada lista que arma la IA</span></span>${tgl("s-log",st.saveLog,"Guardar historial de IA")}</div>
      <button class="srw" id="s-hist"><span class="si">${SI.clock}</span><span class="st"><b>Ver historial de IA</b></span><span class="sv">${S.log.length}</span>${CHEV}</button>
      <button class="srw" id="s-chat"><span class="si">${SI.chat}</span><span class="st"><b>Borrar conversación con Ruta IA</b></span><span class="sv">${(S.chat||[]).length} mensajes</span></button></div></div>

    <div class="sgrp"><p class="lbl">Privacidad y datos</p><div class="slistx">
      <button class="srw" id="s-exp"><span class="si">${SI.dl}</span><span class="st"><b>Copiar mis datos</b><span>Proyectos, ajustes e historial en formato JSON</span></span></button>
      <button class="srw" id="s-ver"><span class="si">${SI.check}</span><span class="st"><b>Borrar precios verificados</b></span><span class="sv">${nv}</span></button>
      <button class="srw dg" id="s-del"><span class="si dg">${SI.trash}</span><span class="st"><b>Borrar todos mis proyectos</b><span>${S.projects.length} ${S.projects.length===1?"guardado":"guardados"} en este navegador</span></span></button></div>
      <p class="muted sm" style="margin:10px 4px 0">RutaMaterial no tiene cuentas ni servidores: todo queda solo en este navegador. No pide datos de pago y el punto de partida es una zona aproximada, no tu ubicación.</p></div>

    <div class="sgrp"><p class="lbl">Acerca de</p><div class="slistx about">
      <div class="srw"><span class="st"><b>Catálogo</b></span><span class="sv">${CAT.length} materiales · ${STORES.length} lugares</span></div>
      <div class="srw"><span class="st"><b>Precios actualizados</b></span><span class="sv">Nov 2026</span></div>
      <details><summary>Cómo funciona</summary><p>La IA lee tu proyecto y arma la lista usando solo productos del catálogo; si falta un detalle, pregunta en vez de suponer. Los totales, la comparación de estrategias y la ruta los calcula la app con reglas fijas, para que los precios no se inventen.</p></details>
      <details><summary>Qué no hace</summary><p>No compra ni paga por ti. No consulta stock ni precios en tiempo real. Los tiempos y distancias son aproximados; el recorrido exacto lo calcula Google Maps.</p></details></div></div>
    <div class="vfoot">${MARK(28)}RutaMaterial 1.0 · Proyecto Crea tu Agente IA · UDD</div>
  </div>`;
  const sv=(k,v,rerender)=>{S.set[k]=v;saveSet();applySet();if(rerender)viewSettings();};
  $("#sedit").onclick=()=>{const f=$("#pform");f.hidden=!f.hidden;$("#sedit").setAttribute("aria-expanded",!f.hidden);if(!f.hidden)$("#pf-name").focus();};
  $("#pf-cancel").onclick=()=>viewSettings();
  $("#pf-save").onclick=()=>{S.set.name=$("#pf-name").value.trim();S.set.role=$("#pf-role").value.trim();S.set.org=$("#pf-org").value.trim();saveSet();applySet();toast("Perfil actualizado");viewSettings();};
  document.querySelectorAll("#s-theme button").forEach(b=>b.onclick=()=>sv("theme",b.dataset.v,true));
  $("#s-fs").onchange=e=>sv("fs",e.target.checked?"lg":"md");
  $("#s-motion").onchange=e=>sv("motion",e.target.checked);
  $("#s-orig").onchange=e=>sv("origen",+e.target.value);
  $("#s-mov").onchange=e=>sv("movil",e.target.value);
  $("#s-prio").onchange=e=>sv("prio",e.target.value);
  $("#s-ask").onchange=e=>sv("askBudget",e.target.checked);
  $("#s-log").onchange=e=>sv("saveLog",e.target.checked);
  $("#s-hist").onclick=()=>go("history");
  $("#s-chat").onclick=()=>{S.chat=[];saveChat();toast("Conversación borrada");viewSettings();};
  $("#s-exp").onclick=async()=>{const data={ajustes:S.set,proyectos:S.projects,historial_ia:S.log,precios_verificados:S.verif};try{await navigator.clipboard.writeText(JSON.stringify(data,null,2));toast("Datos copiados al portapapeles");}catch(e){toast("No se pudo copiar en este navegador");}};
  $("#s-ver").onclick=()=>{S.verif={};saveVerif();toast("Verificaciones borradas");viewSettings();};
  $("#s-del").onclick=()=>sheet(`<h3 style="font-family:var(--disp);font-size:26px;letter-spacing:-.04em;margin:0 0 8px">¿Borrar todos tus proyectos?</h3><p class="muted" style="margin:0 0 20px">Se borran ${S.projects.length} proyectos de este navegador. No se puede deshacer.</p><button class="btn full" id="dy" style="background:var(--bad)">Borrar todo</button><button class="btn out full" id="dn" style="margin-top:8px">Cancelar</button>`,m=>{m.querySelector("#dn").onclick=()=>m.remove();m.querySelector("#dy").onclick=()=>{m.remove();S.projects=[];try{localStorage.setItem("rm_projects","[]");}catch(e){}S.pid=null;Object.assign(S,{form:{desc:"",escala:"",base:"",presu:""},name:"",items:[],preguntas:[],resumen:"",fuera:null,faltantes:[],noenc:[],plan:null,sel:null});renderSide();toast("Proyectos borrados");viewSettings();};});
}
function addLog(e){if(S.set&&S.set.saveLog===false)return;e.t=new Date().toLocaleString("es-CL",{dateStyle:"short",timeStyle:"short"});S.log.unshift(e);S.log=S.log.slice(0,30);try{localStorage.setItem("rm_log",JSON.stringify(S.log));}catch(x){}}

applySet();(()=>{const u=$("#sideuser");if(u){u.onclick=()=>go("settings");u.onkeydown=e=>{if(e.key==="Enter")go("settings");};}})();
go("home");
</script>
